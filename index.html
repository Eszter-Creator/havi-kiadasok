<!doctype html>
<html lang="hu" data-finish="glossy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Havi kiadások</title>
<meta name="theme-color" content="#faf5e9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiad&aacute;sok">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Comfortaa:wght@400;600;700&family=Lora:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #faf5e9;
    --card: #fffdf8;
    --text: #1b2127;
    --muted: #5f6670;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --danger: #c92a2a;
    --warn: #b35c00;
    --ok: #2b8a3e;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --pattern: none;
    --line: color-mix(in srgb, var(--bg), var(--text) 11%);
    --soft: color-mix(in srgb, var(--bg), var(--text) 4%);
    --accent-soft: color-mix(in srgb, var(--card), var(--accent) 14%);
    --danger-soft: color-mix(in srgb, var(--card), var(--danger) 12%);
    --warn-soft: color-mix(in srgb, var(--card), var(--warn) 14%);
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 14px rgba(16, 24, 40, .06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121519; --card: #1c2026; --text: #e8ecf0; --muted: #9aa5b1;
      --accent: #5b9bff; --accent-text: #0b1220;
      --danger: #ff7070; --warn: #ffb454; --ok: #5cc87a;
      --shadow: 0 2px 10px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121519; --card: #1c2026; --text: #e8ecf0; --muted: #9aa5b1;
    --accent: #5b9bff; --accent-text: #0b1220;
    --danger: #ff7070; --warn: #ffb454; --ok: #5cc87a;
    --shadow: 0 2px 10px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: var(--pattern);
    background-attachment: fixed;
    color: var(--text);
    font: 18px/1.45 var(--font);
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 120px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 8px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 1.4rem;
    background: var(--accent); box-shadow: var(--shadow);
  }
  header.top h1 { font-size: 1.35rem; margin: 0; }
  .settings-btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card); box-shadow: var(--shadow);
    font-weight: 700; white-space: nowrap;
  }
  .settings-btn .gear { font-size: 1.15em; line-height: 1; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 18px; margin: 14px 0; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 1.1rem; margin: 0 0 12px; }

  /* Fényes / matt felület */
  [data-finish="glossy"] .card {
    background-color: color-mix(in srgb, var(--card) 78%, transparent);
    background-image: linear-gradient(180deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent 150px);
  }
  [data-finish="matte"] .card { background-color: color-mix(in srgb, var(--card) 84%, transparent); }

  /* Háttérkép: rögzített réteg a tartalom mögött (mobilon is a helyén marad görgetéskor) */
  .scene-layer {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-position: center; background-size: cover; background-repeat: no-repeat;
  }
  :root.has-scene .card {
    background-color: color-mix(in srgb, var(--card) 86%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  :root.has-scene .brand {
    background: color-mix(in srgb, var(--card) 86%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px 6px 6px;
  }
  .bg-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .upload-btn { display: inline-flex; align-items: center; cursor: pointer; min-height: 48px; font-size: .95rem; }
  .bg-actions .btn { min-height: 48px; font-size: .95rem; }
  .tile .prev.scene { height: 72px; background-size: cover; background-position: center; }
  [data-finish="glossy"] .btn.primary,
  [data-finish="glossy"] .fab,
  [data-finish="glossy"] .logo,
  [data-finish="glossy"] .seg button[aria-pressed="true"],
  [data-finish="glossy"] .tabs button[aria-selected="true"] {
    background-image: linear-gradient(180deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, 0) 60%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 4px 14px color-mix(in srgb, var(--accent) 38%, transparent);
  }
  [data-finish="glossy"] .fill { background-image: linear-gradient(180deg, rgba(255, 255, 255, .35), rgba(255, 255, 255, 0)); }
  [data-finish="matte"] { --shadow: none; }
  [data-finish="matte"] .card, [data-finish="matte"] .settings-btn { box-shadow: none; }

  /* Összesítő */
  .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .icon-btn {
    width: 52px; height: 52px; flex: none; border: 1px solid var(--line); border-radius: 14px; background: var(--soft);
    font-size: 1.5rem; line-height: 1; display: grid; place-items: center;
  }
  .icon-btn.sm { width: 44px; height: 44px; font-size: 1.1rem; }
  .month-label { text-align: center; flex: 1; }
  .month-label strong { display: block; font-size: 1.15rem; }
  .link-btn { border: 0; background: none; color: var(--accent); padding: 4px 8px; font-size: .9rem; font-weight: 700; }
  .totals { text-align: center; margin: 18px 0 6px; }
  .totals .label { color: var(--muted); font-size: .95rem; }
  .big { font-size: clamp(2.1rem, 9vw, 3rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .big.multi { font-size: clamp(1.7rem, 7vw, 2.3rem); }
  .big.over { color: var(--danger); }
  .hint { color: var(--muted); font-size: .88rem; }
  .pill { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: var(--soft); color: var(--muted); }
  .pill.closed { background: color-mix(in srgb, var(--card), var(--ok) 16%); color: var(--ok); }

  /* Keret jelző */
  .budget-box { display: grid; gap: 12px; margin-top: 14px; }
  .budget { border-radius: 14px; padding: 12px 14px; background: var(--soft); }
  .budget.warn { background: var(--warn-soft); }
  .budget.over { background: var(--danger-soft); }
  .budget-top { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; font-weight: 700; flex-wrap: wrap; }
  .budget-top .nums { font-variant-numeric: tabular-nums; }
  .budget .track { height: 14px; margin: 8px 0 6px; background: color-mix(in srgb, var(--card), var(--text) 8%); }
  .budget .fill { background-color: var(--ok); }
  .budget.warn .fill { background-color: var(--warn); }
  .budget.over .fill { background-color: var(--danger); }
  .budget-msg { font-size: .9rem; font-weight: 600; }
  .budget.ok .budget-msg { color: var(--ok); }
  .budget.warn .budget-msg { color: var(--warn); }
  .budget.over .budget-msg { color: var(--danger); }
  .budget-cta { text-align: center; }

  /* Diagram */
  .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chart-head h2 { margin: 0; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft);
    font-weight: 700; font-size: .95rem;
  }
  .seg button[aria-pressed="true"] { background-color: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .bar-row .bar-top { display: flex; justify-content: space-between; gap: 10px; font-size: .97rem; }
  .bar-row .bar-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bar-row .bar-val { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-row .bar-val .pct { color: var(--muted); margin-left: 6px; }
  .bar-limit { font-size: .82rem; margin-top: 3px; font-weight: 600; color: var(--muted); }
  .bar-limit.warn { color: var(--warn); }
  .bar-limit.over { color: var(--danger); }
  .track { height: 12px; background: var(--soft); border-radius: 999px; overflow: hidden; margin-top: 5px; }
  .fill { height: 100%; border-radius: 999px; min-width: 4px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }

  /* Űrlap */
  label.field, .field { display: block; font-weight: 700; font-size: .95rem; margin: 0 0 6px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .group { margin-bottom: 14px; }
  input[type=text], input[type=date], input[type=search], select {
    width: 100%; min-height: 54px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card);
  }
  input.amount { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  input[aria-invalid="true"] { border-color: var(--danger); }
  select {
    appearance: none; -webkit-appearance: none; padding-right: 36px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
  }
  select.cur { min-width: 96px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--card); font-size: .95rem;
  }
  .chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--card), var(--c) 18%); font-weight: 800; }
  .cat-hint { margin-top: 8px; font-size: .88rem; color: var(--muted); min-height: 1.3em; }
  .error { background: var(--danger-soft); color: var(--danger); border-radius: 12px; padding: 10px 14px; font-weight: 700; margin-bottom: 12px; }
  .btn { min-height: 56px; padding: 0 22px; border-radius: 14px; border: 1px solid transparent; font-weight: 800; font-size: 1.05rem; }
  .btn.primary { background-color: var(--accent); color: var(--accent-text); width: 100%; }
  .btn.secondary { background: var(--soft); border-color: var(--line); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.danger-outline { background: transparent; border-color: var(--danger); color: var(--danger); width: 100%; }
  .btn.full { width: 100%; }
  .actions { display: flex; gap: 10px; }
  .actions .btn.primary { flex: 1; }

  /* Lista */
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .list-head h2 { margin: 0; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .filters .search { grid-column: 1 / -1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .badge { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 1.25rem; background: color-mix(in srgb, var(--card), var(--c) 20%); }
  .item .badge { align-self: start; }
  .item .note { font-weight: 700; overflow-wrap: anywhere; }
  .item .note.empty { color: var(--muted); font-weight: 400; font-style: italic; }
  .item .meta { color: var(--muted); font-size: .88rem; }
  .item .amt { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; align-self: start; }
  .item .ops { grid-column: 2 / -1; display: flex; gap: 8px; justify-content: flex-end; }
  .small-btn { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); font-size: .88rem; font-weight: 700; }
  .small-btn.del { color: var(--danger); }
  .empty-state { color: var(--muted); text-align: center; padding: 18px 0; }
  .list-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

  /* Havi összesítők */
  .banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-radius: 16px; padding: 12px 14px; margin-top: 8px;
  }
  .banner-text { flex: 1 1 220px; }
  .banner-actions { display: flex; gap: 6px; }
  .history { list-style: none; margin: 0; padding: 0; }
  .history li + li { border-top: 1px solid var(--line); }
  .hist-row { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 8px; border: 0; background: none; text-align: left; border-radius: 10px; min-height: 56px; }
  .hist-row:hover { background: var(--soft); }
  .hist-row[aria-current="true"] { background: var(--accent-soft); }
  .hist-row .hm { font-weight: 700; }
  .hist-row .hm small { display: block; color: var(--muted); font-weight: 400; font-size: .85rem; }
  .hist-row .hm small .overtag { color: var(--danger); font-weight: 700; }
  .hist-row .ht { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hist-row .ht.none { color: var(--muted); font-weight: 400; }
  .year-total { display: flex; justify-content: space-between; gap: 12px; padding: 12px 8px 0; border-top: 2px solid var(--line); margin-top: 4px; font-weight: 800; }
  .year-total .vals { text-align: right; font-variant-numeric: tabular-nums; }

  /* Felugró ablakok */
  .overlay { position: fixed; inset: 0; background: rgba(10, 14, 20, .5); display: none; align-items: flex-end; justify-content: center; z-index: 50; padding: 12px; }
  .overlay.open { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 22px; padding: 18px; max-height: 92vh; overflow: auto; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
  @media (min-width: 640px) { .overlay { align-items: center; } }
  .sheet h2 { margin: 0; font-size: 1.2rem; }
  .sheet h3 { font-size: 1rem; margin: 18px 0 8px; }
  .sheet .seg button { min-height: 46px; padding: 0 16px; font-size: 1rem; }
  .sheet .actions { margin-top: 18px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 0 -4px; padding-left: 4px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: none; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft);
    font-weight: 700; font-size: .95rem; white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { background-color: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); padding: 0; position: relative;
  }
  .swatch[aria-pressed="true"] { outline: 3px solid var(--text); outline-offset: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .tile {
    border: 1.5px solid var(--line); border-radius: 14px; padding: 0; overflow: hidden; background: var(--card); text-align: center; font-size: .85rem; font-weight: 700;
  }
  .tile .prev { display: block; height: 56px; border-bottom: 1px solid var(--line); }
  .tile .lbl { display: block; padding: 6px 4px; }
  .tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .fonts { display: grid; gap: 8px; }
  .font-opt { text-align: left; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); padding: 10px 14px; min-height: 56px; }
  .font-opt b { display: block; font-size: 1.02rem; }
  .font-opt span { color: var(--muted); font-size: .9rem; }
  .font-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .cat-list { list-style: none; margin: 0; padding: 0; }
  .cat-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .cat-row:first-child { border-top: 0; }
  .cat-row .nm { flex: 1; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .cat-row .nm small { display: block; font-weight: 400; color: var(--muted); font-size: .82rem; }
  .emoji-pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-pick button { width: 46px; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--soft); font-size: 1.3rem; padding: 0; }
  .emoji-pick button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: var(--accent-soft); }
  .budget-row { display: grid; grid-template-columns: 1fr 150px; gap: 10px; align-items: center; padding: 6px 0; }
  .budget-row .nm { display: flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
  .budget-row .badge { width: 36px; height: 36px; font-size: 1.05rem; border-radius: 10px; }
  .budget-row input { min-height: 48px; text-align: right; font-variant-numeric: tabular-nums; }
  .budget-total input { font-weight: 800; font-size: 1.15rem; }

  .fab {
    position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 40;
    width: 64px; height: 64px; border-radius: 50%; border: 0; background-color: var(--accent); color: var(--accent-text);
    font-size: 2rem; line-height: 1; box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; width: max-content; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
  .toast.warn { background: var(--warn); color: #fff; }
  .toast.danger { background: var(--danger); color: #fff; }
  .warn-box { background: var(--danger-soft); color: var(--danger); padding: 10px 14px; border-radius: 12px; font-size: .9rem; }

  @media (max-width: 420px) {
    body { font-size: 17px; }
    .card { padding: 16px; border-radius: 18px; }
    .settings-btn .label-text { display: none; }
    .budget-row { grid-template-columns: 1fr 120px; }
  }
</style>
</head>
<body>
<div class="scene-layer" id="sceneLayer" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">💸</span>
      <h1 data-i18n="appTitle">Havi kiadások</h1>
    </div>
    <button type="button" class="settings-btn" id="openSettings" aria-haspopup="dialog">
      <span class="gear" aria-hidden="true">⚙</span>
      <span class="label-text" data-i18n="settings">Beállítások</span>
      <span id="settingsBadge">HU · HUF</span>
    </button>
  </header>

  <div id="storageWarn" class="warn-box" hidden data-i18n="storageWarn"></div>

  <!-- Hónapzárás értesítő -->
  <div class="banner" id="closeBanner" role="status" hidden>
    <div class="banner-text"><span id="bannerText"></span> <strong id="bannerTotals"></strong></div>
    <div class="banner-actions">
      <button type="button" class="small-btn" id="bannerView" data-i18n="view"></button>
      <button type="button" class="small-btn" id="bannerClose" data-i18n-aria="dismiss" aria-label="">✕</button>

  // Rövid kulcsszavaknál (<= 4 betű) csak ezek a toldalékok/ragok engedélyezettek,
  // hogy pl. a „bus” ne illeszkedjen a „business”-re, de a „lidlben” igen.
  const SHORT_SUFFIXES = new Set([
    '', 's', 'es', 'e', 'er', 'en', 'n', 'x', 't', 'et', 'ot', 'at', 'ert', 're', 'ra', 'ba', 'be', 'ban', 'ben',
    'nal', 'nel', 'val', 'vel', 'hoz', 'hez', 'bol', 'tol', 'rol', 'on', 'ja', 'je', 'nak', 'nek',
    'dij', 'dijat', 'szamla', 'szamlat', 'szamlara', 'jegy', 'jegyet', 'berlet', 'karte', 'rechnung', 'kosten',
    'ticket', 'tickets', 'bill', 'besuch', 'ei'
  ]);
  const STOPWORDS = new Set([
    'a', 'az', 'es', 'egy', 'meg', 'is', 'nak', 'nek', 'the', 'and', 'for', 'with', 'at', 'of', 'to', 'in', 'on',
    'der', 'die', 'das', 'und', 'fur', 'mit', 'bei', 'im', 'am', 'zum', 'zur', 'ein', 'eine',
    'le', 'la', 'les', 'de', 'du', 'des', 'et', 'pour', 'avec', 'chez', 'au', 'aux', 'un', 'une', 'en'
  ]);

  function normalize(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/ß/g, 'ss').replace(/œ/g, 'oe').replace(/æ/g, 'ae')
      .replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function tokenize(s) { const n = normalize(s); return n ? n.split(' ') : []; }

  let KW_INDEX = [];
  function buildKwIndex() {
    KW_INDEX = [];
    const add = (cat, kw, bonus) => {
      const n = normalize(kw);
      if (n) KW_INDEX.push({ cat, kw: n, phrase: n.includes(' '), bonus });
    };
    BUILTIN.forEach(cat => KEYWORDS[cat].forEach(kw => add(cat, kw, 0)));
    // A saját kategória neve és kulcsszavai kis előnyt kapnak a beépítettekkel szemben
    state.customCats.forEach(c => [c.name, ...c.keywords].forEach(kw => add(c.id, kw, 2)));
  }

  function tokenMatches(tok, kw) {
    if (tok === kw) return true;
    if (!tok.startsWith(kw)) return false;
    if (kw.length >= 5) return true;
    return SHORT_SUFFIXES.has(tok.slice(kw.length));
  }

  function keywordCategory(note) {
    const toks = tokenize(note);
    if (!toks.length) return null;
    const padded = ' ' + toks.join(' ') + ' ';
    let best = null, bestScore = 0;
    for (const k of KW_INDEX) {
      let hit = false;
      if (k.phrase) hit = padded.includes(' ' + k.kw + ' ') || padded.includes(' ' + k.kw);
      else hit = toks.some(t => tokenMatches(t, k.kw));
      if (hit) {
        const score = k.kw.length + (k.phrase ? 10 : 0) + k.bonus;
        if (score > bestScore) { bestScore = score; best = k.cat; }
      }
    }
    return best;
  }

  function significantTokens(note) {
    return [...new Set(tokenize(note).filter(t => t.length >= 3 && !STOPWORDS.has(t) && !/^\d+$/.test(t)))];
  }
  function tokSimilar(a, b) {
    if (a === b) return true;
    return Math.min(a.length, b.length) >= 4 && (a.startsWith(b) || b.startsWith(a));
  }
  function learnedCategory(note) {
    const toks = significantTokens(note);
    if (!toks.length) return null;
    let best = null;
    for (const e of state.learned) {
      if (!e.t.length) continue;
      const all = e.t.every(lt => toks.some(nt => tokSimilar(lt, nt)));
      if (!all) continue;
      if (!best || e.t.length > best.t.length || (e.t.length === best.t.length && e.ts > best.ts)) best = e;
    }
    return best ? best.c : null;
  }
  function suggest(note) {
    const l = learnedCategory(note);
    if (l) return { cat: l, source: 'learned' };
    const k = keywordCategory(note);
    if (k) return { cat: k, source: 'keyword' };
    return { cat: 'other', source: 'none' };
  }
  function learn(note, cat) {
    const t = significantTokens(note);
    if (!t.length) return;
    const key = t.slice().sort().join(' ');
    state.learned = state.learned.filter(e => e.t.slice().sort().join(' ') !== key);
    state.learned.push({ t, c: cat, ts: Date.now() });
    if (state.learned.length > 500) state.learned.splice(0, state.learned.length - 500);
    persist('learned');
  }

  // ---------- Tárolás ----------
  const KEYS = {

  function persist(key) {
    try { localStorage.setItem(KEYS[key], JSON.stringify(state[key])); }

  function pad(n) { return String(n).padStart(2, '0'); }
  function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function monthOf(dateStr) { return dateStr.slice(0, 7); }
  function shiftMonth(m, delta) {
    let [y, mo] = m.split('-').map(Number);
    mo += delta;
    while (mo < 1) { mo += 12; y--; }
    while (mo > 12) { mo -= 12; y++; }
    return `${y}-${pad(mo)}`;

  const savedSettings = load('settings', {}) || {};

  function allCats() { return [...BUILTIN.slice(0, -1), ...state.customCats.map(c => c.id), 'other']; }
  function customCat(id) { return state.customCats.find(c => c.id === id); }
  function isCat(id) { return BUILTIN.includes(id) || !!customCat(id); }
  function catColor(id) { const c = customCat(id); return c ? c.color : (BUILTIN_COLORS[id] || BUILTIN_COLORS.other); }

  // ---------- Formázás ----------
  const $ = id => document.getElementById(id);
  const t = key => I18N[state.settings.lang][key];
  const catName = c => { const cc = customCat(c); return cc ? cc.name : (I18N[state.settings.lang].cats[c] || I18N[state.settings.lang].cats.other); };
  const locale = () => LOCALES[state.settings.lang];
  function digits(cur) { return cur === 'HUF' ? 0 : 2; }
  function fmtMoney(amount, cur) {
    const d = digits(cur);
    return new Intl.NumberFormat(locale(), { style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol', minimumFractionDigits: d, maximumFractionDigits: d }).format(amount);
  }
  function fmtPlain(n) { return new Intl.NumberFormat(locale(), { useGrouping: false, minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n); }
  function fmtPct(x) { return new Intl.NumberFormat(locale(), { style: 'percent', maximumFractionDigits: 0 }).format(x); }
  function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function fmtDate(s) { return new Intl.DateTimeFormat(locale(), { year: 'numeric', month: 'short', day: 'numeric' }).format(parseDate(s)); }
  function fmtMonth(m) { const [y, mo] = m.split('-').map(Number); return new Intl.DateTimeFormat(locale(), { year: 'numeric', month: 'long' }).format(new Date(y, mo - 1, 1)); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // Összeg értelmezése: „12500”, „12 500”, „12.500”, „12,50”, „1.234,56”, „1,234.56”
  function parseAmount(raw) {
    let s = String(raw || '').replace(/[\s  ']/g, '');
    if (!s) return { error: 'errEmpty' };
    if (!/^[0-9.,]+$/.test(s)) return { error: 'errInvalid' };
    const lastDot = s.lastIndexOf('.'), lastComma = s.lastIndexOf(',');
    if (lastDot >= 0 && lastComma >= 0) {
      const dec = lastDot > lastComma ? '.' : ',';
      const thou = dec === '.' ? ',' : '.';
      s = s.split(thou).join('').replace(dec, '.');
    } else if (lastDot >= 0 || lastComma >= 0) {
      const sep = lastDot >= 0 ? '.' : ',';
      const parts = s.split(sep);
      if (parts.length > 2 || parts[parts.length - 1].length === 3) s = parts.join('');
      else s = parts.join('.');
    }
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return { error: 'errInvalid' };
    const v = Number(s);
    if (!isFinite(v) || v <= 0 || v > 1e10) return { error: 'errInvalid' };
    return { value: v };
  }

  // ---------- Megjelenés: mód, színek, minta, betűtípus ----------
  const darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : { matches: false };
  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgbToHex(c) { return '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
  function mix(a, b, w) { const pa = hexToRgb(a), pb = hexToRgb(b); return rgbToHex(pa.map((v, i) => v * (1 - w) + pb[i] * w)); }
  function luminance(h) {
    return hexToRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); })
      .reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
  }
  function contrast(a, b) { const la = luminance(a), lb = luminance(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }
  function isDark() { return state.settings.theme === 'dark' || (state.settings.theme === 'auto' && darkMq.matches); }
  function accentFor(key, dark, finish) {
    let a = ACCENTS[key];
    if (dark) a = mix(a, '#ffffff', key === 'graphite' ? 0.45 : 0.3);
    if (finish === 'matte') a = mix(a, '#8a8f98', 0.28);
    return a;
  }

  // ---------- Háttérképek (kódból rajzolt, saját illusztrációk) ----------
  // Determinisztikus véletlen, hogy a kép átméretezéskor ne „ugráljon”
  function rng(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  const r1 = n => Math.round(n * 10) / 10;
  function sparkle(x, y, r, color, op) {
    const q = r * 0.18;
    return `<path d="M${r1(x)} ${r1(y - r)} Q${r1(x + q)} ${r1(y - q)} ${r1(x + r)} ${r1(y)} Q${r1(x + q)} ${r1(y + q)} ${r1(x)} ${r1(y + r)} Q${r1(x - q)} ${r1(y + q)} ${r1(x - r)} ${r1(y)} Q${r1(x - q)} ${r1(y - q)} ${r1(x)} ${r1(y - r)} Z" fill="${color}" opacity="${r1(op * 10) / 10}"/>`;
  }
  function starDots(R, n, W, H, maxY, color) {
    let s = '';
    for (let i = 0; i < n; i++) s += `<circle cx="${r1(R() * W)}" cy="${r1(R() * H * maxY)}" r="${r1(0.4 + R() * 1.3)}" fill="${color}" opacity="${r1((0.25 + R() * 0.7) * 10) / 10}"/>`;
    return s;
  }
  function leafPath(L, w) {
    return `M0 ${r1(-L)} C${r1(w)} ${r1(-L * 0.5)} ${r1(w)} ${r1(L * 0.5)} 0 ${r1(L)} C${r1(-w)} ${r1(L * 0.5)} ${r1(-w)} ${r1(-L * 0.5)} 0 ${r1(-L)} Z`;
  }
  function bez(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return [0, 1].map(i => u * u * u * p0[i] + 3 * u * u * t * p1[i] + 3 * u * t * t * p2[i] + t * t * t * p3[i]);
  }

  const SCENE_DRAW = {
    neon(W, H) {
      const R = rng(7), m = Math.min(W, H);
      let s = `<defs>
        <linearGradient id="n1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset=".55" stop-color="#9333ea"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
        <linearGradient id="n2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset=".6" stop-color="#c026d3"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
        <linearGradient id="n3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
        <radialGradient id="pool"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#05030c"/></radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${r1(m * 0.006)}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs><rect width="${W}" height="${H}" fill="#06040d"/>`;
      s += `<ellipse cx="${W / 2}" cy="${r1(H * 0.93)}" rx="${r1(W * 0.8)}" ry="${r1(H * 0.13)}" fill="url(#pool)"/>`;
      s += `<g filter="url(#glow)" fill="none" stroke-linecap="round">`;
      for (let i = 0; i < 18; i++) {
        const x0 = W * (0.5 + (R() - 0.5) * 0.5), y0 = H * 0.86;
        const x1 = W * (0.08 + R() * 0.84), y1 = H * (0.08 + R() * 0.55);
        const left = x1 < W / 2, r = m * (0.04 + R() * 0.08), dir = left ? 1 : -1;
        const d = `M${r1(x0)} ${r1(y0)} C${r1(x0 + (R() - 0.5) * W * 0.6)} ${r1(y0 - H * 0.28)} ${r1(x1 + (R() - 0.5) * W * 0.5)} ${r1(y1 + H * 0.22)} ${r1(x1)} ${r1(y1)}` +

    autumn() {
      const R = rng(11), T = 260;
      const cols = ['#f6c90e', '#f28c28', '#e85d2a', '#c0392b', '#7a9a3a', '#d98e04', '#a0522d', '#9bb06b'];
      let tile = '';
      for (let gy = 0; gy < 3; gy++) for (let gx = 0; gx < 3; gx++) {
        const x = 45 + gx * 85 + (R() - 0.5) * 24, y = 45 + gy * 85 + (R() - 0.5) * 24;
        const rot = Math.round(R() * 360), col = cols[Math.floor(R() * cols.length)], kind = Math.floor(R() * 3);
        let body;
        if (kind === 0) {
          const L = 22 + R() * 8;
          body = `<path d="${leafPath(L, L * 0.55)}" fill="${col}"/><path d="M0 ${r1(L)} V${r1(-L * 0.8)} M0 ${r1(L * 0.2)} L${r1(-L * 0.35)} ${r1(-L * 0.1)} M0 ${r1(-L * 0.15)} L${r1(L * 0.35)} ${r1(-L * 0.45)}" stroke="#fff" stroke-opacity=".45" stroke-width="1.3" fill="none"/>`;
        } else if (kind === 1) {
          const pts = [];
          for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 11 : 26; pts.push(`${r1(Math.cos(a) * rr)} ${r1(Math.sin(a) * rr)}`); }
          body = `<path d="M${pts.join(' L')} Z" fill="${col}" stroke="${col}" stroke-width="6" stroke-linejoin="round"/><path d="M0 26 V-20" stroke="#fff" stroke-opacity=".4" stroke-width="1.2"/>`;
        } else {
          body = `<path d="M0 30 V-30" stroke="${col}" stroke-width="2"/>` + [-20, -8, 4, 16].map((yy, k) =>
            `<path d="${leafPath(8, 4.5)}" fill="${col}" transform="translate(${k % 2 ? 6 : -6} ${yy}) rotate(${k % 2 ? 50 : -50})"/>`).join('');
        }
        tile += `<g transform="translate(${r1(x)} ${r1(y)}) rotate(${rot})">${body}</g>`;
      }
      return `<defs><pattern id="lv" width="${T}" height="${T}" patternUnits="userSpaceOnUse">${tile}</pattern></defs>` +
        `<rect width="100%" height="100%" fill="#0f3b4c"/><rect width="100%" height="100%" fill="url(#lv)"/>`;
    },

    roses(W, H) {
      const R = rng(5), m = Math.min(W, H);
      let s = `<defs>
        <filter id="wc" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="${r1(m * 0.014)}"/><feGaussianBlur stdDeviation="${r1(m * 0.0012)}"/></filter>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${r1(m * 0.012)}"/></filter>
      </defs><rect width="${W}" height="${H}" fill="#f6efe3"/>`;
      s += `<g filter="url(#soft)" opacity=".5">
        <rect x="0" y="0" width="${r1(W * 0.1)}" height="${r1(H * 0.55)}" fill="#e6bf9c"/>
        <rect x="${r1(W * 0.06)}" y="${r1(H * 0.05)}" width="${r1(W * 0.04)}" height="${r1(H * 0.3)}" fill="#c9c4be"/>
        <rect x="${r1(W * 0.35)}" y="${r1(H * 0.04)}" width="${r1(W * 0.5)}" height="${r1(m * 0.035)}" rx="${r1(m * 0.02)}" fill="#e9b996"/>
        <rect x="${r1(W * 0.93)}" y="${r1(H * 0.2)}" width="${r1(W * 0.05)}" height="${r1(H * 0.5)}" fill="#e6bf9c"/>
        <rect x="${r1(W * 0.45)}" y="${r1(H * 0.92)}" width="${r1(W * 0.3)}" height="${r1(m * 0.03)}" fill="#e9b996"/>
        <circle cx="${r1(W * 0.75)}" cy="${r1(H * 0.06)}" r="${r1(m * 0.05)}" fill="#c9c4be"/>
        <circle cx="${r1(W * 0.62)}" cy="${r1(H * 0.93)}" r="${r1(m * 0.04)}" fill="#c9c4be"/>
      </g>`;
      const leaf = (x, y, L, rot, col) => `<path d="${leafPath(L, L * 0.38)}" fill="${col}" transform="translate(${r1(x)} ${r1(y)}) rotate(${Math.round(rot)})" opacity=".85"/>`;
      const sprig = (x, y, L, rot) => {
        let g = `<g transform="translate(${r1(x)} ${r1(y)}) rotate(${Math.round(rot)})"><path d="M0 0 V${r1(-L)}" stroke="#9a6a4c" stroke-width="${r1(m * 0.003)}"/>`;
        for (let k = 1; k <= 5; k++) g += `<path d="${leafPath(L * 0.1, L * 0.035)}" fill="#b97a55" transform="translate(0 ${r1(-L * k / 6)}) rotate(${k % 2 ? 40 : -40}) translate(0 ${r1(-L * 0.08)})"/>`;
        return g + '</g>';
      };
      const rose = (cx, cy, r) => {
        let g = '';
        for (let k = 0; k < 7; k++) { const a = k * 360 / 7; g += `<ellipse cx="${r1(r * 0.48)}" cy="0" rx="${r1(r * 0.52)}" ry="${r1(r * 0.4)}" transform="rotate(${r1(a)})" fill="#f3c6ab" stroke="#d9906c" stroke-width="${r1(r * 0.025)}"/>`; }
        for (let k = 0; k < 6; k++) { const a = 25 + k * 60; g += `<ellipse cx="${r1(r * 0.26)}" cy="0" rx="${r1(r * 0.36)}" ry="${r1(r * 0.28)}" transform="rotate(${a})" fill="#eba98a" stroke="#c97a57" stroke-width="${r1(r * 0.022)}"/>`; }
        for (let k = 0; k < 4; k++) { const a = 10 + k * 90; g += `<ellipse cx="${r1(r * 0.11)}" cy="0" rx="${r1(r * 0.2)}" ry="${r1(r * 0.16)}" transform="rotate(${a})" fill="#dc8f6c" stroke="#b5623f" stroke-width="${r1(r * 0.02)}"/>`; }
        g += [0.13, 0.08, 0.035].map(q => `<circle r="${r1(r * q)}" fill="none" stroke="#a9563a" stroke-width="${r1(r * 0.02)}"/>`).join('');
        return `<g transform="translate(${r1(cx)} ${r1(cy)}) rotate(${Math.round(R() * 90)})">${g}</g>`;
      };
      const cluster = (list, spread) => {
        let leaves = '', roses = '', dots = '';
        list.forEach(([x, y, r]) => {
          for (let k = 0; k < 4; k++) leaves += leaf(x + (R() - 0.5) * r * 2.4, y + (R() - 0.5) * r * 2.4, r * (0.45 + R() * 0.3), R() * 360, ['#a06a4a', '#6b6460', '#c89270'][k % 3]);
          leaves += sprig(x + (R() - 0.5) * r, y - r * 0.4, r * (1.6 + R()), (R() - 0.5) * 120);
          roses += rose(x, y, r);

        for (let k = 0; k < 26; k++) dots += `<circle cx="${r1(spread[0] + R() * spread[2])}" cy="${r1(spread[1] + R() * spread[3])}" r="${r1(0.8 + R() * 2.4)}" fill="#c98b62" opacity=".6"/>`;
        return `<g filter="url(#wc)">${leaves}${roses}</g>${dots}`;
      };

      s += cluster([[W * 0.12, H * 0.64, rr], [W * 0.1, H * 0.84, rr * 0.95], [W * 0.38, H * 0.9, rr * 0.9]], [0, H * 0.5, W * 0.5, H * 0.5]);
      s += cluster([[W * 0.88, H * 0.12, rr * 0.95]], [W * 0.6, 0, W * 0.4, H * 0.3]);

        <ellipse cx="-5.4" cy="-63" rx="1.6" ry="3.3" fill="#050505"/><ellipse cx="5.4" cy="-63" rx="1.6" ry="3.3" fill="#050505"/>

    sakura(W, H) {
      const R = rng(29), m = Math.min(W, H);
      let s = `<defs><linearGradient id="pk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6f9"/><stop offset="1" stop-color="#f9d3e2"/></linearGradient></defs>` +
        `<rect width="${W}" height="${H}" fill="url(#pk)"/>`;
      const blossom = (x, y, r, col) => {
        let g = '';
        for (let k = 0; k < 5; k++) g += `<ellipse cx="0" cy="${r1(-r * 0.55)}" rx="${r1(r * 0.42)}" ry="${r1(r * 0.55)}" transform="rotate(${k * 72})" fill="${col}" stroke="#f08db0" stroke-width=".7"/>`;
        g += `<circle r="${r1(r * 0.2)}" fill="#e2557f"/>`;
        for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; g += `<circle cx="${r1(Math.cos(a) * r * 0.32)}" cy="${r1(Math.sin(a) * r * 0.32)}" r="${r1(r * 0.05)}" fill="#c2185b"/>`; }
        return `<g transform="translate(${r1(x)} ${r1(y)}) rotate(${Math.round(R() * 72)})">${g}</g>`;
      };
      const branch = (p0, p1, p2, p3, w, n) => {
        let g = `<path d="M${r1(p0[0])} ${r1(p0[1])} C${r1(p1[0])} ${r1(p1[1])} ${r1(p2[0])} ${r1(p2[1])} ${r1(p3[0])} ${r1(p3[1])}" stroke="#5b3a35" stroke-width="${r1(w)}" fill="none" stroke-linecap="round"/>`;
        let flowers = '';
        for (let i = 0; i < n; i++) {
          const [x, y] = bez(p0, p1, p2, p3, 0.15 + R() * 0.85);
          flowers += blossom(x + (R() - 0.5) * m * 0.08, y + (R() - 0.5) * m * 0.07, m * (0.025 + R() * 0.025), ['#f9b8cf', '#ffd6e4', '#ffffff', '#f7a1c0'][Math.floor(R() * 4)]);
        }
        return g + flowers;
      };
      s += branch([-W * 0.05, H * 0.04], [W * 0.2, H * 0.02], [W * 0.45, H * 0.2], [W * 0.82, H * 0.17], m * 0.024, 16);
      s += branch([W * 0.2, H * 0.08], [W * 0.25, H * 0.15], [W * 0.3, H * 0.25], [W * 0.26, H * 0.33], m * 0.012, 6);
      s += branch([W * 1.05, H * 0.96], [W * 0.85, H * 0.9], [W * 0.75, H * 0.84], [W * 0.55, H * 0.83], m * 0.018, 9);
      for (let i = 0; i < 34; i++) s += `<ellipse cx="${r1(R() * W)}" cy="${r1(R() * H)}" rx="${r1(m * 0.008)}" ry="${r1(m * 0.013)}" fill="#f7a8c4" opacity=".7" transform="rotate(${Math.round(R() * 180)} ${0})"/>`.replace(/cx="([\d.]+)" cy="([\d.]+)"(.*)rotate\((\d+) 0\)/, (all, cx, cy, mid, a) => `cx="${cx}" cy="${cy}"${mid}rotate(${a} ${cx} ${cy})`);
      return s;
    }
  };

  function sceneUrl(id, W, H) {
    const draw = SCENE_DRAW[id];
    if (!draw) return 'none';
    W = Math.max(120, Math.round(W)); H = Math.max(120, Math.round(H));
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${draw(W, H)}</svg>`;
    return `url('data:image/svg+xml,${encodeURIComponent(svg)}')`;
  }

  // Egy 140×140-es csempe két, eltérően elforgatott motívummal, így szórt, nyomatszerű hatást ad
  function patternCss(kind, color, op) {
    const m = MOTIFS[kind];
    if (!m) return 'none';
    const filled = typeof m === 'object';
    const body = filled ? m.body : m;
    const paint = filled
      ? `fill="${color}" stroke="none" opacity="${(op * 0.75).toFixed(3)}"`
      : `fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"`;
    const second = kind === 'feet' ? 'translate(104 102) rotate(20) scale(-0.85 0.85)' : 'translate(104 102) rotate(18) scale(0.85)';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140"><g ${paint}>` +
      `<g transform="translate(36 38) rotate(-14)">${body}</g><g transform="${second}">${body}</g></g></svg>`;
    return `url('data:image/svg+xml,${encodeURIComponent(svg)}')`;
  }

  function applyAppearance() {
    const s = state.settings, root = document.documentElement, dark = isDark();
    if (s.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', s.theme);
    root.dataset.finish = s.finish;
    const tint = TINTS[s.bgTint];
    const bg = dark ? tint[2] : tint[0];
    const card = dark ? tint[3] : tint[1];
    const accent = accentFor(s.accent, dark, s.finish);
    const accentText = contrast(accent, '#ffffff') >= contrast(accent, '#0b1220') ? '#ffffff' : '#0b1220';
    state.resolvedAccent = accent;
    root.style.setProperty('--bg', bg);
    root.style.setProperty('--card', card);
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-text', accentText);
    root.style.setProperty('--font', FONTS[s.font]);
    const hasScene = s.scene !== 'none';
    root.classList.toggle('has-scene', hasScene);
    root.style.setProperty('--pattern', hasScene ? 'none' : patternCss(s.pattern, accent, dark ? 0.28 : 0.24));
    const layer = $('sceneLayer');
    if (s.scene === 'custom') layer.style.backgroundImage = `url("${state.customBg}")`;
    else if (hasScene) {
      const key = `${s.scene}|${sceneSize[0]}|${sceneSize[1]}`;
      if (layer.dataset.key !== key) { layer.style.backgroundImage = sceneUrl(s.scene, sceneSize[0], sceneSize[1]); layer.dataset.key = key; }
    } else { layer.style.backgroundImage = 'none'; layer.dataset.key = ''; }
    if (s.scene === 'custom') layer.dataset.key = '';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', bg);
  }
  if (darkMq.addEventListener) darkMq.addEventListener('change', () => { if (state.settings.theme === 'auto') renderAll(); });

  // A háttérkép a képernyő méretére rajzolódik; csak szélességváltáskor vagy nagy magasságváltáskor rajzoljuk újra
  // (mobilon görgetéskor a címsor eltűnése miatt kicsit változik a magasság)
  let sceneSize = [window.innerWidth, window.innerHeight];
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const w = window.innerWidth, h = window.innerHeight;
      if (Math.abs(w - sceneSize[0]) > 2 || Math.abs(h - sceneSize[1]) / sceneSize[1] > 0.2) { sceneSize = [w, h]; applyAppearance(); }
    }, 250);
  });
  const scenePreviews = {};
  function scenePreview(id) { return scenePreviews[id] || (scenePreviews[id] = sceneUrl(id, 220, 130)); }

  // Saját kép: legfeljebb 1600 px-re kicsinyítve, JPEG-ként tároljuk a böngészőben
  function downscaleImage(file, max, quality) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }
  async function onBgFile(ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    let dataUrl;
    try { dataUrl = await downscaleImage(file, 1600, 0.82); } catch (e) { toast(t('bgError'), 'danger', 4000); return; }
    try { localStorage.setItem('hk.customBg.v1', dataUrl); } catch (e) { toast(t('bgTooLarge'), 'danger', 4500); return; }
    state.customBg = dataUrl;
    state.settings.scene = 'custom';
    persist('settings');
    renderAll();
    toast(t('bgSaved'));
  }
  function removeCustomBg() {
    try { localStorage.removeItem('hk.customBg.v1'); } catch (e) { /* nincs tárolás */ }
    state.customBg = null;
    if (state.settings.scene === 'custom') state.settings.scene = 'none';
    persist('settings');
    renderAll();
    toast(t('bgRemoved'));
  }

  // ---------- Keretek ----------
  function getBudget(cur) {
    const b = state.budgets[cur] || {};
    return { total: typeof b.total === 'number' ? b.total : null, cats: b.cats || {} };
  }
  function budgetStatus(spent, limit) {
    if (!limit) return null;
    if (spent > limit) return 'over';
    if (spent >= limit * 0.8) return 'warn';
    return 'ok';
  }
  const RANK = { ok: 0, warn: 1, over: 2 };
  function budgetState(month, cur, cat) {
    const items = state.expenses.filter(e => monthOf(e.date) === month && e.currency === cur);
    const total = items.reduce((s, e) => s + e.amount, 0);
    const catTotal = items.filter(e => e.category === cat).reduce((s, e) => s + e.amount, 0);
    const b = getBudget(cur);
    const catLimit = b.cats[cat] || null;
    return {
      t: budgetStatus(total, b.total), tOver: total - (b.total || 0),
      c: budgetStatus(catTotal, catLimit), cOver: catTotal - (catLimit || 0)
    };
  }
  function budgetAlert(before, after, cur, cat) {
    const up = (a, b) => a && RANK[a] > RANK[b || 'ok'];
    if (up(after.t, before.t) && after.t === 'over') return { kind: 'danger', msg: t('alertTotalOver')(cur, fmtMoney(after.tOver, cur)) };
    if (up(after.c, before.c) && after.c === 'over') return { kind: 'danger', msg: t('alertCatOver')(catName(cat), fmtMoney(after.cOver, cur)) };
    if (up(after.t, before.t)) return { kind: 'warn', msg: t('alertTotalWarn')(cur) };
    if (up(after.c, before.c)) return { kind: 'warn', msg: t('alertCatWarn')(catName(cat)) };
    return null;
  }

  function renderBudgetSettings() {
    const cur = state.budgetCur;
    $('budgetCurSeg').innerHTML = CURRENCIES.map(c =>
      `<button type="button" data-budgetcur="${c}" aria-pressed="${c === cur}">${c}</button>`).join('');
    const b = getBudget(cur);
    const total = $('budgetTotal');
    total.value = b.total != null ? fmtPlain(b.total) : '';
    total.removeAttribute('aria-invalid');
    $('budgetCats').innerHTML = allCats().map(c => `
      <div class="budget-row">
        <label class="nm" for="bc-${c}"><span class="badge" style="--c:${catColor(c)}" aria-hidden="true">${catIcon(c)}</span>${esc(catName(c))}</label>
        <input type="text" id="bc-${c}" inputmode="decimal" data-budget-cat="${c}" value="${b.cats[c] ? esc(fmtPlain(b.cats[c])) : ''}" placeholder="${esc(t('budgetPh'))}">
      </div>`).join('');
  }

  function monthExpenses(m) { return state.expenses.filter(e => monthOf(e.date) === m); }
  function sortCurrencies(curs) {
    return curs.sort((a, b) =>
      (a === state.settings.currency ? -1 : b === state.settings.currency ? 1 : CURRENCIES.indexOf(a) - CURRENCIES.indexOf(b)));
  }
  function monthTotals(m) {
    const items = monthExpenses(m);
    const totals = {};
    items.forEach(e => { totals[e.currency] = (totals[e.currency] || 0) + e.amount; });
    return { totals, currencies: sortCurrencies(Object.keys(totals)), count: items.length };
  }
  function totalsText(totals, curs) { return curs.map(c => fmtMoney(totals[c], c)).join(' + '); }
  // Az elmúlt 12 hónap, a legfrissebb (aktuális) hónappal kezdve
  function last12Months() {
    const cur = monthOf(todayStr());
    return Array.from({ length: 12 }, (_, i) => shiftMonth(cur, -i));
  }

  function renderBanner() {
    const m = state.closedBanner;
    $('closeBanner').hidden = !m;
    if (!m) return;
    const mt = monthTotals(m);
    $('bannerText').textContent = t('monthClosed')(fmtMonth(m));
    $('bannerTotals').textContent = mt.count ? totalsText(mt.totals, mt.currencies) : t('noSpending');
  }

  function renderHistory() {
    const current = monthOf(todayStr());
    const yearTotals = {};
    $('history').innerHTML = last12Months().map(m => {
      const mt = monthTotals(m);
      mt.currencies.forEach(c => { yearTotals[c] = (yearTotals[c] || 0) + mt.totals[c]; });
      const status = m === current ? t('inProgress') : t('closed');
      const over = mt.currencies.some(c => budgetStatus(mt.totals[c], getBudget(c).total) === 'over');
      return `<li><button type="button" class="hist-row" data-month="${m}" aria-current="${m === state.viewMonth}">
        <span class="hm">${esc(fmtMonth(m))}<small>${esc(status)} · ${esc(t('items')(mt.count))}${over ? ` · <span class="overtag">⚠ ${esc(t('overBudget'))}</span>` : ''}</small></span>
        <span class="ht${mt.count ? '' : ' none'}">${mt.count
          ? mt.currencies.map(c => `<div>${esc(fmtMoney(mt.totals[c], c))}</div>`).join('')
          : esc(t('noSpending'))}</span>
      </button></li>`;
    }).join('');
    const yc = sortCurrencies(Object.keys(yearTotals));
    $('yearTotal').innerHTML = `<span>${esc(t('yearTotal'))}</span><span class="vals">${yc.length
      ? yc.map(c => `<div>${esc(fmtMoney(yearTotals[c], c))}</div>`).join('')
      : esc(fmtMoney(0, state.settings.currency))}</span>`;

  function renderBudgetBox(totals) {
    const curs = CURRENCIES.filter(c => getBudget(c).total && (totals[c] || c === state.settings.currency));
    if (!curs.length) {
      $('budgetBox').innerHTML = `<div class="budget-cta"><button type="button" class="link-btn" data-open-budget>🎯 ${esc(t('setBudget'))}</button></div>`;
      return;
    }
    $('budgetBox').innerHTML = curs.map(c => {
      const spent = totals[c] || 0, lim = getBudget(c).total, st = budgetStatus(spent, lim);
      const ratio = spent / lim;
      const msg = st === 'over' ? t('budgetOver')(fmtMoney(spent - lim, c))
        : st === 'warn' ? t('budgetWarn')(fmtPct(ratio), fmtMoney(lim - spent, c))
        : t('budgetOk')(fmtMoney(lim - spent, c));
      return `<div class="budget ${st}" data-cur="${c}">
        <div class="budget-top"><span>🎯 ${esc(t('budget'))}${curs.length > 1 ? ' · ' + c : ''}</span>
          <span class="nums">${esc(fmtMoney(spent, c))} / ${esc(fmtMoney(lim, c))} · ${esc(fmtPct(ratio))}</span></div>
        <div class="track" aria-hidden="true"><div class="fill" style="width:${Math.min(ratio, 1) * 100}%"></div></div>
        <div class="budget-msg">${st === 'ok' ? '✓' : '⚠'} ${esc(msg)}</div>

      return `
      <li class="bar-row" data-cat="${c}">
        <div class="bar-top">
          <span class="bar-name"><span class="dot" style="background:${catColor(c)}"></span>${catIcon(c)} ${esc(catName(c))}</span>
          <span class="bar-val">${esc(fmtMoney(byCat[c], cur))}<span class="pct">${esc(fmtPct(byCat[c] / total))}</span></span>
        </div>
        <div class="track" aria-hidden="true"><div class="fill" style="width:${(byCat[c] / max * 100).toFixed(1)}%;background-color:${fillColor}"></div></div>
        ${limitLine}
      </li>`;
    }).join('');
  }

  function renderChips() {
    if (!isCat(state.form.cat)) state.form.cat = 'other';
    $('chips').innerHTML = allCats().map(c => `
      <button type="button" class="chip" data-cat="${c}" style="--c:${catColor(c)}" aria-pressed="${c === state.form.cat}">
        <span aria-hidden="true">${catIcon(c)}</span>${esc(catName(c))}
      </button>`).join('');
    const f = state.form;
    let key;
    if (f.manual) key = 'catManual';
    else if (f.source === 'saved') key = 'catSaved';
    else if (f.source === 'learned') key = 'catLearned';
    else if (f.source === 'keyword') key = 'catAuto';
    else key = $('note').value.trim() ? 'catNone' : '';
    $('catHint').textContent = key ? t(key) : '';
  }

  function renderCurrencySelect() {
    const sel = $('formCurrency');
    const val = sel.value || state.settings.currency;
    sel.innerHTML = CURRENCIES.map(c => `<option value="${c}">${c}</option>`).join('');
    sel.value = val;
  }

  function renderFilters() {
    const months = new Set(state.expenses.map(e => monthOf(e.date)));
    months.add(state.viewMonth);
    months.add(monthOf(todayStr()));
    const list = [...months].sort().reverse();
    $('fMonth').innerHTML = `<option value="all">${esc(t('allMonths'))}</option>` +
      list.map(m => `<option value="${m}">${esc(fmtMonth(m))}</option>`).join('');
    $('fMonth').value = state.listAll ? 'all' : state.viewMonth;
    if (state.filterCat !== 'all' && !isCat(state.filterCat)) state.filterCat = 'all';
    $('fCat').innerHTML = `<option value="all">${esc(t('allCategories'))}</option>` +
      allCats().map(c => `<option value="${c}">${esc(catName(c))}</option>`).join('');
    $('fCat').value = state.filterCat;
  }

  function filteredExpenses() {
    const q = normalize(state.search);
    return state.expenses
      .filter(e => state.listAll || monthOf(e.date) === state.viewMonth)
      .filter(e => state.filterCat === 'all' || e.category === state.filterCat)
      .filter(e => !q || normalize(e.note).includes(q))
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt));
  }

  function renderList() {
    const items = filteredExpenses();
    $('count').textContent = t('items')(items.length);
    $('listEmpty').hidden = items.length > 0;
    $('items').innerHTML = items.map(e => `
      <li class="item" data-id="${e.id}">
        <div class="badge" style="--c:${catColor(e.category)}" aria-hidden="true">${catIcon(e.category)}</div>
        <div>
          <div class="note${e.note ? '' : ' empty'}">${e.note ? esc(e.note) : esc(t('noNote'))}</div>
          <div class="meta">${esc(fmtDate(e.date))} · ${esc(catName(e.category))}</div>
        </div>
        <div class="amt">${esc(fmtMoney(e.amount, e.currency))}</div>
        <div class="ops">
          <button type="button" class="small-btn" data-edit="${e.id}">${esc(t('edit'))}</button>
          <button type="button" class="small-btn del" data-del="${e.id}">${esc(t('delete'))}</button>
        </div>
      </li>`).join('');
  }

  function refresh() {
    renderSummary();
    renderFilters();
    renderList();
    renderHistory();
    renderBanner();
  }

  function renderAll() {
    applyAppearance();
    applyStaticTexts();
    renderSettings();
    renderCurrencySelect();
    renderChips();
    refresh();
    if (state.form.errorKey) showError(state.form.errorKey);
  }

  // ---------- Űrlap ----------
  function showError(key) {
    state.form.errorKey = key;
    const box = $('formError');
    if (!key) { box.hidden = true; box.textContent = ''; $('amount').removeAttribute('aria-invalid'); $('date').removeAttribute('aria-invalid'); return; }
    box.textContent = t(key);
    box.hidden = false;
    if (key === 'errDate') $('date').setAttribute('aria-invalid', 'true'); else $('amount').setAttribute('aria-invalid', 'true');
  }

  function resetForm() {
    state.form = { editingId: null, cat: 'other', manual: false, source: 'none', errorKey: null };
    $('amount').value = '';
    $('note').value = '';
    $('date').value = todayStr();
    $('formCurrency').value = state.settings.currency;
    $('cancelEdit').hidden = true;
    showError(null);
    applyStaticTexts();
    renderChips();
  }

  function onNoteInput() {
    if (state.form.manual) return;
    const s = suggest($('note').value);
    state.form.cat = s.cat;
    state.form.source = s.source;
    renderChips();
  }

  function onSubmit(ev) {
    ev.preventDefault();
    const amt = parseAmount($('amount').value);
    if (amt.error) { showError(amt.error); $('amount').focus(); return; }
    const date = $('date').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(parseDate(date))) { showError('errDate'); $('date').focus(); return; }
    showError(null);
    const currency = $('formCurrency').value;
    const note = $('note').value.trim();
    const cat = state.form.cat;
    const amount = Number(amt.value.toFixed(digits(currency)));
    if (state.form.manual && suggest(note).cat !== cat) learn(note, cat);

    const before = budgetState(monthOf(date), currency, cat);
    let okMsg;
    if (state.form.editingId) {
      const e = state.expenses.find(x => x.id === state.form.editingId);
      if (e) Object.assign(e, { amount, currency, date, note, category: cat, updatedAt: Date.now() });
      okMsg = t('updated');
    } else {
      state.expenses.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        amount, currency, date, note, category: cat, createdAt: Date.now()
      });
      okMsg = t('saved');
    }
    persist('expenses');
    const alert = budgetAlert(before, budgetState(monthOf(date), currency, cat), currency, cat);
    if (alert) toast(`${okMsg} ⚠ ${alert.msg}`, alert.kind, 5000);
    else toast(okMsg);
    resetForm();
    refresh();
  }

  function startEdit(id) {
    const e = state.expenses.find(x => x.id === id);
    if (!e) return;
    state.form = { editingId: id, cat: e.category, manual: false, source: 'saved', errorKey: null };
    $('amount').value = fmtPlain(e.amount);
    $('formCurrency').value = e.currency;
    $('date').value = e.date;
    $('note').value = e.note;
    $('cancelEdit').hidden = false;
    showError(null);
    applyStaticTexts();
    renderChips();
    $('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(() => $('amount').focus({ preventScroll: true }), 300);
  }

  // ---------- Megerősítés, törlés ----------
  function openConfirm({ title, what, text, yes, onYes }) {
    $('confirmTitle').textContent = title;
    $('confirmWhat').textContent = what || '';
    $('confirmWhat').hidden = !what;
    $('confirmText').textContent = text;
    $('confirmYes').textContent = yes;
    state.confirmAction = onYes;
    openOverlay('confirmOverlay', 'confirmNo');
  }

  function askDelete(id) {
    const e = state.expenses.find(x => x.id === id);
    if (!e) return;
    state.pendingDelete = id;
    openConfirm({
      title: t('confirmDeleteTitle'), text: t('confirmDeleteText'), yes: t('confirmDelete'),
      what: `${fmtDate(e.date)} · ${fmtMoney(e.amount, e.currency)}${e.note ? ' · ' + e.note : ''}`,
      onYes: doDelete
    });
  }
  function doDelete() {
    const id = state.pendingDelete;
    state.expenses = state.expenses.filter(x => x.id !== id);
    if (state.form.editingId === id) resetForm();
    persist('expenses');
    closeOverlay('confirmOverlay');
    toast(t('deleted'));
    refresh();
  }

  function askReset() {
    openConfirm({ title: t('resetTitle'), text: t('resetText')(state.expenses.length), yes: t('resetYes'), onYes: doReset });
  }
  function doReset() {
    state.expenses = [];
    state.learned = [];
    state.customCats = [];
    state.budgets = {};
    ['expenses', 'learned', 'customCats', 'budgets'].forEach(persist);
    buildKwIndex();
    Object.assign(state, { viewMonth: monthOf(todayStr()), listAll: false, filterCat: 'all', search: '', chartCurrency: null, closedBanner: null });
    $('fSearch').value = '';
    resetForm();
    $('confirmOverlay').classList.remove('open');
    $('settingsOverlay').classList.remove('open');
    renderAll();
    toast(t('resetDone'));
    $('openSettings').focus();
  }

  // ---------- Saját kategóriák ----------
  function addCategory() {
    const name = $('newCatName').value.trim();
    const err = $('catError');
    const fail = key => { err.textContent = t(key); err.hidden = false; $('newCatName').setAttribute('aria-invalid', 'true'); $('newCatName').focus(); };
    if (!name) return fail('errCatName');
    const n = normalize(name);
    const exists = allCats().some(c => normalize(catName(c)) === n) ||
      Object.values(I18N).some(L => Object.values(L.cats).some(x => normalize(x) === n));
    if (exists) return fail('errCatExists');
    err.hidden = true;
    $('newCatName').removeAttribute('aria-invalid');
    const keywords = $('newCatKw').value.split(/[,;]/).map(s => s.trim()).filter(Boolean).slice(0, 40);
    state.customCats.push({ id: 'c_' + Date.now().toString(36), name, icon: state.newCat.icon, color: state.newCat.color, keywords });
    persist('customCats');
    buildKwIndex();
    $('newCatName').value = '';
    $('newCatKw').value = '';
    renderAll();
    if (!state.form.manual && !state.form.editingId) onNoteInput();
    toast(t('catAdded'));
  }
  function askCatDelete(id) {
    const c = customCat(id);
    if (!c) return;
    const n = state.expenses.filter(e => e.category === id).length;
    openConfirm({ title: t('confirmCatDeleteTitle')(c.name), text: t('confirmCatDeleteText')(n), yes: t('delete'), onYes: () => doCatDelete(id) });
  }
  function doCatDelete(id) {
    state.expenses.forEach(e => { if (e.category === id) e.category = 'other'; });
    state.learned = state.learned.filter(e => e.c !== id);
    Object.values(state.budgets).forEach(b => { if (b.cats) delete b.cats[id]; });
    state.customCats = state.customCats.filter(c => c.id !== id);
    ['expenses', 'learned', 'customCats', 'budgets'].forEach(persist);
    buildKwIndex();
    if (state.form.cat === id) state.form.cat = 'other';
    closeOverlay('confirmOverlay');
    renderAll();
    toast(t('catDeleted'));
  }

  // ---------- Keret beállítása ----------
  function onBudgetChange(ev) {
    const el = ev.target;
    if (!el.matches('[data-budget], [data-budget-cat]')) return;
    const cur = state.budgetCur;
    const b = state.budgets[cur] = state.budgets[cur] || {};
    b.cats = b.cats || {};
    const raw = el.value.trim();
    let value = null;
    if (raw) {
      const p = parseAmount(raw);
      if (p.error) { el.setAttribute('aria-invalid', 'true'); toast(t('errInvalid'), 'danger', 3500); return; }
      value = Number(p.value.toFixed(digits(cur)));
    }
    el.removeAttribute('aria-invalid');
    if (el.dataset.budget === 'total') { if (value == null) delete b.total; else b.total = value; }
    else { if (value == null) delete b.cats[el.dataset.budgetCat]; else b.cats[el.dataset.budgetCat] = value; }
    if (value != null) el.value = fmtPlain(value);
    persist('budgets');
    renderSummary();
    renderHistory();
    toast(t('budgetSaved'));
  }

  // ---------- CSV ----------
  function csvCell(v) {
    const s = String(v);
    return /[",;\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function buildCsv() {
    const rows = [['date', 'amount', 'currency', 'category_id', 'category', 'note']];
    state.expenses.slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt))
      .forEach(e => rows.push([e.date, e.amount.toFixed(digits(e.currency)), e.currency, e.category, catName(e.category), e.note]));
    return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  }
  function exportCsv() {
    if (!state.expenses.length) { toast(t('exportEmpty')); return; }
    downloadCsv(buildCsv(), `kiadasok-${todayStr()}.csv`);
  }
  async function downloadCsv(text, filename) {
    // A claude.ai-n közzétett változatban a böngésző letiltja a sima letöltést, ott a downloads képességgel mentünk
    if (window.claude && window.claude.use) {
      const downloads = await window.claude.use('downloads');
      if (downloads) {
        try {
          await downloads.save({ filename, data: '﻿' + text });
          toast(t('exported'));
        } catch (e) {
          if (e && e.code !== 'declined') toast(e.message || 'CSV', 'danger', 3500);
        }
        return;
      }
    }
    const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(t('exported'));
  }

  // Havi összesítők: hónaponként és pénznemenként egy sor, kategóriánkénti bontással
  function buildMonthlyCsv() {
    const current = monthOf(todayStr());
    const cats = allCats();
    const rows = [['month', 'status', 'currency', 'total', 'budget', 'items', ...cats.map(c => customCat(c) ? catName(c) : c)]];
    [...new Set(state.expenses.map(e => monthOf(e.date)))].sort().forEach(m => {
      const items = monthExpenses(m);
      sortCurrencies([...new Set(items.map(e => e.currency))]).forEach(c => {
        const sub = items.filter(e => e.currency === c);
        const d = digits(c);
        const sum = list => list.reduce((s, e) => s + e.amount, 0).toFixed(d);
        const lim = getBudget(c).total;
        rows.push([m, m < current ? 'closed' : 'in_progress', c, sum(sub), lim != null ? lim.toFixed(d) : '', sub.length,
          ...cats.map(cat => sum(sub.filter(e => e.category === cat)))]);
      });
    });
    return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  }
  function exportMonthlyCsv() {
    if (!state.expenses.length) { toast(t('exportEmpty')); return; }
    downloadCsv(buildMonthlyCsv(), `havi-osszesitok-${todayStr()}.csv`);
  }

  function goToMonth(m) {
    if (!m) return;
    state.viewMonth = m;
    state.listAll = false;
    refresh();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- Felugró ablakok, értesítés ----------
  let lastFocus = null;
  function openOverlay(id, focusId) {
    lastFocus = document.activeElement;
    $(id).classList.add('open');
    setTimeout(() => $(focusId).focus(), 0);
  }
  function closeOverlay(id) {
    $(id).classList.remove('open');
    if (lastFocus && lastFocus.isConnected && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function openSettings(tab) {
    if (tab) state.settingsTab = tab;
    renderSettings();
    openOverlay('settingsOverlay', 'closeSettingsX');
  }
  let toastTimer = null;
  function toast(msg, kind, ms) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2200);
  }

  // ---------- Események ----------
  $('form').addEventListener('submit', onSubmit);
  $('note').addEventListener('input', onNoteInput);
  $('amount').addEventListener('input', () => { if (state.form.errorKey && state.form.errorKey !== 'errDate') showError(null); });
  $('date').addEventListener('input', () => { if (state.form.errorKey === 'errDate') showError(null); });
  $('chips').addEventListener('click', ev => {
    const b = ev.target.closest('[data-cat]');
    if (!b) return;
    state.form.cat = b.dataset.cat;
    state.form.manual = true;
    renderChips();
  });
  $('cancelEdit').addEventListener('click', resetForm);

  $('prevMonth').addEventListener('click', () => { state.viewMonth = shiftMonth(state.viewMonth, -1); refresh(); });
  $('nextMonth').addEventListener('click', () => { state.viewMonth = shiftMonth(state.viewMonth, 1); refresh(); });
  $('todayMonth').addEventListener('click', () => { state.viewMonth = monthOf(todayStr()); refresh(); });
  $('chartCurrency').addEventListener('click', ev => {
    const b = ev.target.closest('[data-chartcur]');
    if (b) { state.chartCurrency = b.dataset.chartcur; renderSummary(); }
  });
  $('budgetBox').addEventListener('click', ev => { if (ev.target.closest('[data-open-budget]')) openSettings('budget'); });

  $('fMonth').addEventListener('change', ev => {
    if (ev.target.value === 'all') state.listAll = true;
    else { state.listAll = false; state.viewMonth = ev.target.value; renderSummary(); renderHistory(); }
    renderList();
  });
  $('history').addEventListener('click', ev => {
    const b = ev.target.closest('[data-month]');
    if (b) goToMonth(b.dataset.month);
  });
  $('bannerView').addEventListener('click', () => goToMonth(state.closedBanner));
  $('bannerClose').addEventListener('click', () => { state.closedBanner = null; renderBanner(); });
  $('exportMonthlyBtn').addEventListener('click', exportMonthlyCsv);
  $('exportMonthlyBtn2').addEventListener('click', exportMonthlyCsv);
  $('fCat').addEventListener('change', ev => { state.filterCat = ev.target.value; renderList(); });
  $('fSearch').addEventListener('input', ev => { state.search = ev.target.value; renderList(); });
  $('items').addEventListener('click', ev => {
    const ed = ev.target.closest('[data-edit]');
    if (ed) return startEdit(ed.dataset.edit);
    const del = ev.target.closest('[data-del]');
    if (del) askDelete(del.dataset.del);
  });
  $('exportBtn').addEventListener('click', exportCsv);
  $('exportBtn2').addEventListener('click', exportCsv);

  $('openSettings').addEventListener('click', () => openSettings());
  $('closeSettings').addEventListener('click', () => closeOverlay('settingsOverlay'));
  $('closeSettingsX').addEventListener('click', () => closeOverlay('settingsOverlay'));
  $('settingsOverlay').addEventListener('click', ev => {
    const tab = ev.target.closest('[data-tab]');
    if (tab) { state.settingsTab = tab.dataset.tab; renderSettings(); return; }
    const set = ev.target.closest('[data-set]');
    if (set) {
      const key = set.dataset.set, val = set.dataset.val;
      state.settings[key] = val;
      if (key === 'pattern') state.settings.scene = 'none';
      persist('settings');
      if (key === 'currency') { state.budgetCur = val; if (!state.form.editingId) $('formCurrency').value = val; }
      renderAll();
      return;
    }
    const ic = ev.target.closest('[data-newicon]');
    if (ic) { state.newCat.icon = ic.dataset.newicon; renderCatManager(); return; }
    const col = ev.target.closest('[data-newcolor]');
    if (col) { state.newCat.color = col.dataset.newcolor; renderCatManager(); return; }
    const dc = ev.target.closest('[data-delcat]');
    if (dc) { askCatDelete(dc.dataset.delcat); return; }
    const bc = ev.target.closest('[data-budgetcur]');
    if (bc) { state.budgetCur = bc.dataset.budgetcur; renderBudgetSettings(); }
  });
  $('settingsOverlay').addEventListener('change', onBudgetChange);
  $('addCatBtn').addEventListener('click', addCategory);
  $('newCatName').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); addCategory(); } });
  $('newCatName').addEventListener('input', () => { $('catError').hidden = true; $('newCatName').removeAttribute('aria-invalid'); });
  $('resetBtn').addEventListener('click', askReset);
  $('bgFile').addEventListener('change', onBgFile);
  $('bgRemove').addEventListener('click', removeCustomBg);

  $('confirmNo').addEventListener('click', () => closeOverlay('confirmOverlay'));
  $('confirmYes').addEventListener('click', () => { if (state.confirmAction) state.confirmAction(); });
  document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', ev => { if (ev.target === o) closeOverlay(o.id); }));
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape') return;
    const open = [...document.querySelectorAll('.overlay.open')];
    if (open.length) closeOverlay(open[open.length - 1].id);
  });
  $('fab').addEventListener('click', () => {
    $('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(() => $('amount').focus({ preventScroll: true }), 300);
  });

  // ---------- Indítás ----------
  try { localStorage.setItem('hk.test', '1'); localStorage.removeItem('hk.test'); } catch (e) { storageOk = false; }
  $('storageWarn').hidden = storageOk;
  $('date').value = todayStr();
  buildKwIndex();
  // Hónapváltás után az első megnyitáskor megjelenik az előző (lezárt) hónap összesítője
  (function checkMonthClosed() {
    const current = monthOf(todayStr());
    const lastSeen = load('lastSeenMonth', null);
    if (lastSeen && lastSeen < current) {
      const prev = shiftMonth(current, -1);
      if (monthExpenses(prev).length) state.closedBanner = prev;
    }
    state.lastSeenMonth = current;
    persist('lastSeenMonth');
  })();
  renderAll();
  $('formCurrency').value = state.settings.currency;

  // Teszteléshez
  window.__kiadas = { suggest, keywordCategory, parseAmount, buildCsv, buildMonthlyCsv, state };
})();
</script>
<script>
  // Offline működés: a service worker eltárolja az alkalmazást az első megnyitáskor
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script></body>
